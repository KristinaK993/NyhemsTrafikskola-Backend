name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages
        run: dotnet restore NyhemsTrafikskola/NyhemsTrafikskola.sln

      - name: Build solution
        run: dotnet build NyhemsTrafikskola/NyhemsTrafikskola.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test NyhemsTrafikskola/NyhemsTrafikskola.sln --configuration Release --no-build
